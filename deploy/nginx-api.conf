# Belongs at /etc/nginx/sites-available/api.bakbak.mouan.in on the EC2 host,
# symlinked into sites-enabled/. Replaces the scaffold currently there, which
# still carries `server_name api.example.com` and has no TLS block — so requests
# for the real host fall through to the default server instead of matching here.
#
# Apply with:
#   sudo cp nginx-api.conf /etc/nginx/sites-available/api.bakbak.mouan.in
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.bakbak.mouan.in;

    # Leave ACME reachable over plain HTTP so certbot can renew without the
    # redirect bouncing its challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.bakbak.mouan.in;

    ssl_certificate     /etc/letsencrypt/live/api.bakbak.mouan.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bakbak.mouan.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Attachments are capped at 20MB for video; nginx's 1MB default would
    # reject those uploads with a 413 before the API ever sees them.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO upgrades from polling to websocket on the same path, so the
        # upgrade headers must be forwarded or the transport silently stays on
        # long-polling (and eventually fails).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Sockets are idle between messages. nginx's 60s default would drop
        # them mid-session; this must exceed the Socket.IO ping interval.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Server-push events must reach the client immediately rather than
        # sitting in nginx's response buffer.
        proxy_buffering off;
    }
}
