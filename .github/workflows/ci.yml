name: CI

on:
  pull_request:
  # Test pushes to non-main branches; main is covered by the deploy workflow,
  # which runs this file as a reusable workflow before publishing.
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The integration suite is pinned to the test database (NODE_ENV=test selects
  # DEV_DB_TEST_URL in packages/db/src/resolve-db-url.ts) so CI can never touch
  # a dev or production database.
  NODE_ENV: test
  DEV_DB_TEST_URL: postgresql://bakbak:bakbak@localhost:5432/bakbak_test
  REDIS_URL: redis://localhost:6379
  STORAGE_ENDPOINT: localhost
  STORAGE_PORT: "9000"
  STORAGE_USE_SSL: "false"
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY: minioadmin
  STORAGE_SECRET_KEY: minioadmin
  STORAGE_BUCKET: bakbak

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bakbak
          POSTGRES_PASSWORD: bakbak
          POSTGRES_DB: bakbak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bakbak -d bakbak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          # Match the Bun version that wrote bun.lock and that the
          # infra Dockerfiles target (oven/bun:1.3-slim).
          bun-version: "1.3"

      # The job starts MinIO as a bare `server` process, so do the one-shot
      # bucket setup (same as infra/docker-compose.yml's minio-init) here.
      # The retry loop doubles as a readiness wait.
      - name: Create uploads bucket
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c \
              "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null 2>&1 && mc mb --ignore-existing local/bakbak"; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun --cwd packages/db generate

      - name: Validate Prisma schema
        run: bun --cwd packages/db validate

      - name: Migrate test database
        run: bun --cwd packages/db migrate:deploy

      - name: Lint
        run: bun run lint

      - name: API typecheck
        run: bun --cwd apps/api typecheck

      - name: Version stamp
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::8}"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            VERSION="pr-${{ github.event.pull_request.number }}-${VERSION}"
          elif [ "${GITHUB_REF_NAME}" != "main" ]; then
            VERSION="${GITHUB_REF_NAME}-${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_GIT_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VERSION_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: API integration tests
        run: bun --cwd apps/api test

      - name: Build web
        env:
          VITE_APP_VERSION: ${{ env.VERSION }}
          VITE_GIT_COMMIT: ${{ env.VERSION_GIT_COMMIT }}
        run: bun --cwd apps/web build