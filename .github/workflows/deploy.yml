name: Deploy

# Runs CI first as a gate, then deploys to the EC2 host over SSH: fetch the
# exact commit CI validated, install, regenerate the Prisma client, apply
# migrations, and restart the systemd unit.
#
# There is no container step. The API runs under systemd via Bun — on a
# t3.micro the Docker daemon's ~100-150MB is a sixth of the box's RAM for no
# benefit at a single instance. See deploy/bakbak-api.service.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # APP_VERSION is deliberately not stamped here: the version comes from the
      # root package.json so the API and the web bundle derive it from the same
      # commit. Stamping a SHA would override the semver and make every tab look
      # stale against a web build that carries the package.json value.
      - name: Build metadata
        shell: bash
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Forward the stamps computed above into the remote shell.
          envs: BUILD_TIME,GITHUB_SHA
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/bakbak

            # Deploy the exact commit CI validated, not whatever main points at
            # by the time this runs. reset --hard also discards any drift that
            # accumulated on the box.
            git fetch --prune origin
            git reset --hard "$GITHUB_SHA"

            bun install --frozen-lockfile

            # The Prisma client is generated code, not a published artifact —
            # skipping this after a schema change produces runtime errors that
            # look like database bugs.
            cd packages/db
            export DATABASE_URL="$(grep -E '^PRODUCTION_DB_URL=' ~/bakbak/.env.prod | cut -d= -f2-)"
            bunx prisma generate
            bunx prisma migrate deploy
            cd ~/bakbak

            # Version stamps for GET /api/v1/version, which the web client
            # compares against its own build to detect a stale tab.
            # Provenance only. APP_VERSION is intentionally absent so the value
            # from package.json wins — see the Build metadata step above.
            cat > .env.version <<STAMP
            GIT_COMMIT=$GITHUB_SHA
            BUILD_TIME=$BUILD_TIME
            STAMP

            sudo systemctl restart bakbak-api
            # Fail the deploy here rather than letting the smoke test below
            # time out ambiguously if the unit refuses to come back.
            sudo systemctl is-active --quiet bakbak-api

      - name: Smoke test the deployed API
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://${{ secrets.API_DOMAIN }}/readyz" || true)
            if [ "$code" = "200" ]; then
              echo "readyz OK after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt ${i}: got ${code}, retrying"
            sleep 6
          done
          echo "readyz never returned 200 — check: journalctl -u bakbak-api -n 50"
          exit 1
