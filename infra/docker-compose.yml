name: bakbak

# Local stack for development and testing: a Postgres with a dev DB and a
# throwaway test DB, a SeaweedFS bucket for uploads, Redis for rate limiting and
# caching, and the Prometheus + Loki + Grafana observability stack (the API
# exposes metrics at GET /metrics — see apps/api/src/system/metrics.ts).
#
#   docker compose -f infra/docker-compose.yml up -d            # the full stack
#   docker compose -f infra/docker-compose.yml --profile test run --rm tests
#
# See infra/README.md.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bakbak
      POSTGRES_PASSWORD: bakbak
      POSTGRES_DB: bakbak_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakbak -d bakbak_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  # SeaweedFS is the object store backing uploads. It runs as its S3-compatible
  # gateway (spawned by `weed server -s3`); the API only talks S3 via
  # @aws-sdk/client-s3 with path-style URLs, which this gateway implements.
  # Ports: 8333 = S3 gateway, 8888 = filer (used by the auth-config init), 9333 = master.
  # Pinned to 3.83: verified there that static-key identities load from the
  # filer when the gateway live-reloads /etc/iam/identity.json (newer 4.x reads
  # it too but also ships `-s3.iam`/STS assumptions that add noise).
  seaweedfs:
    image: chrislusf/seaweedfs:3.83
    command: server -dir=/data -s3
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfsdata:/data

  # One-shot: deposit the S3 IAM config into the filer at /etc/iam/identity.json
  # (the path the gateway watches). The gateway subscribes to /etc and
  # live-reloads on change, so static creds (infra/seaweedfs/identity.json) are
  # enforced from here on; the API then self-creates its bucket on first ping.
  # Uses curlimages/curl rather than the SeaweedFS image because `curl` exists
  # only in newer 4.x builds, and this image is pinned to 3.83. The retry loops
  # double as readiness waits; the second push covers the cold-boot window when
  # the /etc subscription is not established yet.
  seaweedfs-init:
    image: curlimages/curl:8.22.0
    depends_on:
      seaweedfs:
        condition: service_started
    volumes:
      - ./seaweedfs/identity.json:/etc/seaweedfs/identity.json:ro
    entrypoint: |
      /bin/sh -c "
      set -e
      curl -sf --retry 30 --retry-delay 2 --retry-connrefused http://seaweedfs:8888/ -o /dev/null
      curl -sfX POST http://seaweedfs:8888/etc/iam/?op=mkdir -o /dev/null || true
      curl -sf --retry 30 --retry-delay 2 --retry-connrefused http://seaweedfs:8333/ -o /dev/null
      curl -sfX POST -F file=@/etc/seaweedfs/identity.json http://seaweedfs:8888/etc/iam/identity.json
      sleep 2
      curl -sfX POST -F file=@/etc/seaweedfs/identity.json http://seaweedfs:8888/etc/iam/identity.json
      "

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  # TURN/STUN for WebRTC calls. STUN lets a browser discover its own public
  # address; TURN relays the media when the two NATs won't open a direct path
  # between the peers (roughly one call in five, more on mobile networks).
  #
  # Credentials use coturn's REST-API scheme: the API mints short-lived
  # username/password pairs from the same TURN_STATIC_AUTH_SECRET, so no
  # long-term password is ever shipped to a browser. See apps/api/src/calls.
  coturn:
    image: coturn/coturn:4.6-alpine
    # Flags rather than a turnserver.conf: the conf format has no environment
    # interpolation, and the secret has to come from .env.
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-bakbak.local}
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-dev-turn-secret}
      - --listening-port=3478
      # Relay range, kept small on purpose: every port here is published on the
      # host, and coturn's default range is ~16k ports.
      - --min-port=49160
      - --max-port=49200
      # The address coturn advertises as the relay candidate. Left unset it
      # discovers the container's Docker IP (172.x) — which no browser on the
      # host can reach, so STUN works but TURN relaying silently doesn't.
      # Uncomment with the address clients actually reach coturn on: the host's
      # LAN IP locally, the public IP once deployed. It has no usable default,
      # and an empty --external-ip= is rejected, so it stays commented.
      # - --external-ip=${TURN_EXTERNAL_IP}
      - --fingerprint
      - --no-multicast-peers
      - --no-cli
      # No TLS locally — turns: needs a certificate. Nothing in this file is
      # used in production, where TURN must be TLS-terminated.
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:${LOKI_VERSION:-latest}
    ports:
      # Push API for the API's pino-loki transport (http://localhost:3100)
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Runs the API integration suite against the containers above.
  # `--profile test` keeps it out of the default `up`.
  tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DEV_DB_TEST_URL: postgresql://bakbak:bakbak@postgres:5432/bakbak_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-secret
      FRONTEND_URL: http://localhost:5173
      RESEND_API_KEY: re_test
      STORAGE_ENDPOINT: seaweedfs
      STORAGE_PORT: "8333"
      STORAGE_USE_SSL: "false"
      STORAGE_REGION: us-east-1
      # Must match infra/seaweedfs/identity.json, which seaweedfs-init deposits
      # into the filer (the gateway denies anything unsigned or wrong-keyed).
      STORAGE_ACCESS_KEY: seaweedfs
      STORAGE_SECRET_KEY: seaweedfs
      STORAGE_BUCKET: bakbak

volumes:
  pgdata:
  seaweedfsdata:
  redisdata:
  promdata:
  lokidata:
  grafanadata:
