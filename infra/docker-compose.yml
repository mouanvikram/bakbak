name: bakbak

# Local stack for development and testing: a Postgres with a dev DB and a
# throwaway test DB, a MinIO bucket for uploads, Redis for rate limiting and
# caching, and the Prometheus + Loki + Grafana observability stack (the API
# exposes metrics at GET /metrics — see apps/api/src/system/metrics.ts).
#
#   docker compose -f infra/docker-compose.yml up -d            # the full stack
#   docker compose -f infra/docker-compose.yml --profile test run --rm tests
#
# See infra/README.md.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bakbak
      POSTGRES_PASSWORD: bakbak
      POSTGRES_DB: bakbak_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakbak -d bakbak_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  # MinIO pulled its Docker Hub repositories in Sept 2026; the Quay.io mirror
  # still hosts the last frozen release (what quay's `latest` points to).
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: create the uploads bucket. Objects stay private — every read
  # goes through a pre-signed URL issued by the API, never an anonymous GET.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bakbak
      "

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  # TURN/STUN for WebRTC calls. STUN lets a browser discover its own public
  # address; TURN relays the media when the two NATs won't open a direct path
  # between the peers (roughly one call in five, more on mobile networks).
  #
  # Credentials use coturn's REST-API scheme: the API mints short-lived
  # username/password pairs from the same TURN_STATIC_AUTH_SECRET, so no
  # long-term password is ever shipped to a browser. See apps/api/src/calls.
  coturn:
    image: coturn/coturn:4.6-alpine
    # Flags rather than a turnserver.conf: the conf format has no environment
    # interpolation, and the secret has to come from .env.
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-bakbak.local}
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-dev-turn-secret}
      - --listening-port=3478
      # Relay range, kept small on purpose: every port here is published on the
      # host, and coturn's default range is ~16k ports.
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-multicast-peers
      - --no-cli
      # No TLS locally — turns: needs a certificate. Nothing in this file is
      # used in production, where TURN must be TLS-terminated.
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:${LOKI_VERSION:-latest}
    ports:
      # Push API for the API's pino-loki transport (http://localhost:3100)
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Runs the API integration suite against the containers above.
  # `--profile test` keeps it out of the default `up`.
  tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DEV_DB_TEST_URL: postgresql://bakbak:bakbak@postgres:5432/bakbak_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-secret
      FRONTEND_URL: http://localhost:5173
      RESEND_API_KEY: re_test
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: "9000"
      STORAGE_USE_SSL: "false"
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: bakbak

volumes:
  pgdata:
  miniodata:
  redisdata:
  promdata:
  lokidata:
  grafanadata:
