name: bakbak

# Local infrastructure: a Postgres with a dev DB and a throwaway test DB,
# plus a MinIO bucket for uploads.
#
#   docker compose -f infra/docker-compose.yml up -d            # just the infra
#   docker compose -f infra/docker-compose.yml --profile test run --rm tests
#
# See infra/README.md.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bakbak
      POSTGRES_PASSWORD: bakbak
      POSTGRES_DB: bakbak_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakbak -d bakbak_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: create the uploads bucket and make objects publicly readable.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bakbak &&
      mc anonymous set download local/bakbak
      "

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s
  # Runs the API integration suite against the containers above.
  # `--profile test` keeps it out of the default `up`.
  tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: test
      DEV_DB_TEST_URL: postgresql://bakbak:bakbak@postgres:5432/bakbak_test
      JWT_SECRET: test-secret
      FRONTEND_URL: http://localhost:5173
      RESEND_API_KEY: re_test
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: "9000"
      STORAGE_USE_SSL: "false"
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: bakbak

volumes:
  pgdata:
  miniodata:
  redisdata:
